name: Reproduce saved-results audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned, SHA-256-verified inputs
        run: make fetch
      - name: Reproduce offline with two hash seeds
        shell: bash
        run: |
          for seed in 0 1; do
            PYTHONHASHSEED="$seed" make reproduce
            git diff --exit-code
            test -z "$(git status --porcelain --untracked-files=normal)"
          done
